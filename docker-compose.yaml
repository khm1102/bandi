services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"   # 3306은 로컬의 다른 MySQL과 충돌 방지를 위해 3307로 고정
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: bandi
      MYSQL_USER: bandi
      MYSQL_PASSWORD: bandi1234
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bandi-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bandi-minio-root-dev}
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bandi-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bandi-minio-root-dev}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-bandi}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-bandi-minio-dev}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-bandi-private}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-bandi-public}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PUBLIC_BUCKET}"
        mc anonymous set none "local/$${MINIO_PRIVATE_BUCKET}"
        mc anonymous set download "local/$${MINIO_PUBLIC_BUCKET}"
        mc admin user add local "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" || true
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$${MINIO_PRIVATE_BUCKET}"'","arn:aws:s3:::'"$${MINIO_PUBLIC_BUCKET}"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$${MINIO_PRIVATE_BUCKET}"'/*","arn:aws:s3:::'"$${MINIO_PUBLIC_BUCKET}"'/*"]}]}' > /tmp/bandi-app-policy.json
        mc admin policy create local bandi-app /tmp/bandi-app-policy.json
        mc admin policy attach local bandi-app --user "$${MINIO_ACCESS_KEY}"

volumes:
  mysql-data:
  minio-data:
