name: Verify and deploy test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      deploy:
        description: 테스트 서버까지 재배포합니다.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: bandi_test
          MYSQL_USER: bandi
          MYSQL_PASSWORD: bandi1234
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot1234 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트 파일 저장 경로 준비
        run: mkdir -p "$FILE_STORAGE_ROOT"
        env:
          FILE_STORAGE_ROOT: ${{ runner.temp }}/bandi-files

      - name: 전체 빌드와 테스트
        run: ./gradlew build --no-daemon
        env:
          FILE_STORAGE_ROOT: ${{ runner.temp }}/bandi-files

  deploy-test:
    name: Deploy test server
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.deploy)
    runs-on:
      - self-hosted
      - linux
      - x64
      - bandi-test
    environment: test
    timeout-minutes: 30
    concurrency:
      group: bandi-test-deploy
      cancel-in-progress: false
    env:
      DEPLOY_ENV_FILE: /etc/bandi/.env.test
      COMPOSE_PROJECT_NAME: bandi
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: 배포 환경 확인
        run: |
          set -euo pipefail
          compose() {
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f docker-compose.test.yaml "$@"
          }
          test -r "$DEPLOY_ENV_FILE"
          test "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' bandi-test-app)" = "$COMPOSE_PROJECT_NAME"
          docker network inspect bandi-test-network >/dev/null
          compose config --quiet

      - name: 애플리케이션만 재배포
        run: |
          set -euo pipefail
          compose() {
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f docker-compose.test.yaml "$@"
          }
          # mysql 서비스와 named volume은 기존 테스트 데이터를 보존하기 위해 건드리지 않는다.
          # Cloudflare Tunnel은 별도 인프라에서 운영하므로 이 배포 범위에 포함하지 않는다.
          compose up -d --no-deps --build app

      - name: 컨테이너 기동 확인
        run: |
          set -euo pipefail
          compose() {
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f docker-compose.test.yaml "$@"
          }
          for attempt in $(seq 1 30); do
            if compose ps --status running --services app | grep -qx 'app' \
              && compose logs --no-log-prefix --tail=200 app | grep -q 'Started .* in'; then
              compose exec -T app sh -c 'test -d /data/bandi && test -w /data/bandi'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: 실패 진단 로그
        if: ${{ failure() }}
        run: |
          compose() {
            docker compose --project-name "$COMPOSE_PROJECT_NAME" --env-file "$DEPLOY_ENV_FILE" -f docker-compose.test.yaml "$@"
          }
          compose ps app
          compose logs --tail=200 app
